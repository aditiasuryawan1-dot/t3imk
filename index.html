<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Buku Baru - Perpustakaan Pintar</title>
    <style>
        /* --- 1. GAYA DASAR & WARNA --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }

        /* --- 2. ATASAN & MENU (NAVIGASI) --- */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: #bdc3c7;
            text-decoration: none;
            margin-right: 15px;
            font-size: 14px;
        }

        nav a.aktif {
            color: white;
            font-weight: bold;
        }

        /* --- 3. WADAH UTAMA --- */
        .wadah-utama {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .sub-judul {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* --- 4. SEKAT KELOMPOK DATA --- */
        .sekat-form {
            border-top: 2px solid #ecf0f1;
            padding-top: 20px;
            margin-bottom: 25px;
        }

        .judul-sekat {
            font-size: 16px;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 15px;
        }

        /* --- 5. KOTAK ISIAN (INPUT) --- */
        .grup-input {
            margin-bottom: 15px;
        }

        .grup-input-kembar {
            display: flex;
            gap: 15px;
        }

        .grup-input-kembar .grup-input {
            flex: 1;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #2c3e50;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #3498db;
        }

        .petunjuk {
            font-size: 12px;
            color: #e74c3c;
            margin-top: 4px;
        }

        /* --- 6. TOMBOL AKSI --- */
        .grup-tombol {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #ecf0f1;
            padding-top: 20px;
        }

        .tombol {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .tombol-batal {
            background-color: #95a5a6;
            color: white;
        }

        .tombol-batal:hover {
            background-color: #7f8c8d;
        }

        .tombol-simpan {
            background-color: #3498db;
            color: white;
        }

        .tombol-simpan:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <!-- NAVIGASI ATAS -->
    <header>
        <strong>📂 PERPUSTAKAAN PINTAR</strong>
        <nav>
            <a href="#">Beranda</a>
            <a href="#" class="aktif">Data Buku</a>
            <a href="#">Peminjaman</a>
            <a href="#">Pengembalian</a>
        </nav>
    </header>

    <!-- FORMULIR UTAMA -->
    <div class="wadah-utama">
        <h2>Tambah Buku Baru</h2>
        <p class="sub-judul">📝 Isi data buku dengan lengkap dan benar.</p>

        <form action="#" method="POST">
            
            <!-- SEKAT 1: IDENTITAS UTAMA -->
            <div class="sekat-form">
                <div class="judul-sekat">Identitas Utama Buku</div>
                
                <div class="grup-input">
                    <label for="judul">Judul Buku</label>
                    <input type="text" id="judul" name="judul" placeholder="Masukkan judul lengkap buku..." required>
                </div>

                <div class="grup-input">
                    <label for="penulis">Nama Penulis / Pengarang</label>
                    <input type="text" id="penulis" name="penulis" placeholder="Masukkan nama penulis atau pencipta buku..." required>
                </div>

                <div class="grup-input">
                    <label for="isbn">Nomor ISBN</label>
                    <input type="text" id="isbn" name="isbn" placeholder="Contoh: 313-661-7753-88-8" required>
                    <p class="petunjuk">*Gunakan tanda strip (-) sesuai standar</p>
                </div>
            </div>

            <!-- SEKAT 2: DETAIL PENERBITAN -->
            <div class="sekat-form">
                <div class="judul-sekat">Detail Penerbitan & Stok</div>

                <div class="grup-input">
                    <label for="penerbit">Nama Penerbit</label>
                    <input type="text" id="penerbit" name="penerbit" placeholder="Masukkan nama perusahaan penerbit..." required>
                </div>

                <div class="grup-input-kembar">
                    <div class="grup-input">
                        <label for="tahun">Tahun Terbit</label>
                        <select id="tahun" name="tahun" required>
                            <option value="">Pilih Tahun</option>
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                            <option value="2022">2022</option>
                        </select>
                    </div>

                    <div class="grup-input">
                        <label for="stok">Jumlah Salinan (Stok)</label>
                        <input type="number" id="stok" name="stok" min="1" max="100" placeholder="0" required>
                    </div>
                </div>
            </div>

            <!-- TOMBOL AKSI -->
            <div class="grup-tombol">
                <a href="#" class="tombol tombol-batal">Batal</a>
                <button type="submit" class="tombol tombol-simpan">💾 Simpan Data</button>
            </div>

        </form>
    </div>

</body>
</html>
